# =============================================================
# nginx-site.conf — 安全生产管理系统站点配置
#   · 静态前端 + Supabase API 反向代理（同源部署，无跨域问题）
#   安装:
#     cp nginx-site.conf /etc/nginx/sites-available/project-reporting
#     ln -sf /etc/nginx/sites-available/project-reporting /etc/nginx/sites-enabled/
#     rm -f /etc/nginx/sites-enabled/default
#     nginx -t && systemctl reload nginx
# =============================================================

server {
    listen 80;
    server_name _;

    # 前端静态文件
    root /var/www/project-reporting;
    index index.html;

    # 证照附件上传最大 10MB，留余量
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存一周（文件名带 hash 场景；本项目直接版更时刷新）
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- Supabase API 反向代理 ----------
    # 两个历史坑，改动前务必看清：
    # 1) location 必须用 ^~ 前缀：否则上面那条静态资源正则（匹配 .png/.jpg）
    #    优先级更高，会把 /storage/v1/object/.../照片.png 当静态文件处理，
    #    导致图片附件上传/下载直接 404 Not Found。
    # 2) 必须显式 proxy_http_version 1.1：Nginx 默认用 HTTP/1.0 转发，
    #    Kong 对 HTTP/1.0 请求返回 426 Upgrade Required，会导致登录、
    #    数据读取全部失败（报错 "Upgrade Required" is not valid JSON）。
    # REST (PostgREST)
    location ^~ /rest/v1/ {
        proxy_pass http://127.0.0.1:8000/rest/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 认证 (GoTrue)
    location ^~ /auth/v1/ {
        proxy_pass http://127.0.0.1:8000/auth/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 存储 (Storage) —— 附件上传/下载/签名 URL
    location ^~ /storage/v1/ {
        proxy_pass http://127.0.0.1:8000/storage/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_request_buffering off;   # 大文件流式转发
    }

    # 实时通道 (Realtime WebSocket)
    location ^~ /realtime/v1/ {
        proxy_pass http://127.0.0.1:8000/realtime/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
