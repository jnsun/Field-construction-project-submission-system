<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安全生产管理系统</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/qualification-module.css">
  <link rel="stylesheet" href="css/training-module.css">
</head>
<body>
  <!-- 应用根容器 -->
  <div id="app">
    <!-- 加载动画 -->
    <div id="loading-screen" class="loading-screen">
      <div class="spinner"></div>
      <p>系统加载中...</p>
    </div>
  </div>

  <!-- Toast 通知容器 -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Supabase JS SDK v2（本地引入，避免 CDN 加载失败） -->
  <script src="vendor/supabase.min.js"></script>
  <!-- Excel 解析库（资质证照批量导入 CertImport 依赖 XLSX 全局） -->
  <script src="vendor/xlsx.full.min.js"></script>
  <!-- PDF 渲染库（培训教育员工端逐页阅读 PDF 并统计学习进度） -->
  <script src="vendor/pdf.min.js"></script>
  <!-- 脚本按顺序加载：基础 → 各业务模块 → 注册表 → 应用入口 -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/modules/report/reporter.js"></script>
  <script src="js/modules/report/admin.js"></script>
  <script src="js/modules/qualification/certs.js"></script>
  <script src="js/modules/qualification/admin.js"></script>
  <script src="js/modules/qualification/import.js"></script>
  <script src="js/modules/qualification.js"></script>
  <script src="js/modules/inspection.js"></script>
  <script src="js/modules/vehicle.js"></script>
  <script src="js/modules/docstudy.js"></script>
  <script src="js/modules/performance.js"></script>
  <script src="js/modules/contract.js"></script>
  <script src="js/modules/training/training.js"></script>
  <script src="js/modules/training/employees.js"></script>
  <script src="js/modules/training/plans.js"></script>
  <script src="js/modules/training/records.js"></script>
  <script src="js/modules/training/exams.js"></script>
  <script src="js/modules/training/courses.js"></script>
  <script src="js/modules/training/mine.js"></script>
  <script src="js/modules/notice.js"></script>
  <script src="js/modules/registry.js"></script>
  <script src="js/account.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
