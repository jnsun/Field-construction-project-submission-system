<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>培训课件生成器 · Markdown → 单文件 HTML</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f3f4f6; color: #111827; }
  .toolbar {
    position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #e5e7eb;
    padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  .toolbar h1 { font-size: 16px; margin-right: auto; }
  .toolbar .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .toolbar input { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
  .btn {
    padding: 7px 14px; border-radius: 6px; border: 1px solid #d1d5db; background: #fff;
    font-size: 13px; cursor: pointer;
  }
  .btn-primary { background: #4f46e5; border-color: #4f46e5; color: #fff; }
  .btn-primary:hover { background: #4338ca; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .split { display: flex; height: calc(100vh - 53px); }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .pane + .pane { border-left: 1px solid #e5e7eb; }
  .pane-head {
    padding: 8px 14px; font-size: 12px; color: #6b7280; background: #f9fafb;
    border-bottom: 1px solid #e5e7eb; display: flex; gap: 10px; align-items: center;
  }
  #md-input {
    flex: 1; border: none; resize: none; padding: 14px; font-size: 13px; line-height: 1.7;
    font-family: Consolas, "Courier New", monospace; outline: none;
  }
  #preview { flex: 1; border: none; background: #fff; }
  .tip { color: #9ca3af; }
  .tab.active { background: #eef2ff; border-color: #4f46e5; color: #4f46e5; font-weight: 600; }
  #html-input {
    flex: 1; border: none; resize: none; padding: 14px; font-size: 12px; line-height: 1.6;
    font-family: Consolas, "Courier New", monospace; outline: none; display: none;
  }
  body.mode-inject #html-input { display: block; }
  body.mode-inject #md-input,
  body.mode-inject #meta-title,
  body.mode-inject #meta-org,
  body.mode-inject #btn-sample,
  body.mode-inject .only-md { display: none; }
  .only-inj { display: none; }
  body.mode-inject .only-inj { display: flex; }
  @media (max-width: 900px) { .split { flex-direction: column; } .pane + .pane { border-left: none; border-top: 1px solid #e5e7eb; } }
</style>
</head>
<body>

<div class="toolbar">
  <h1>培训课件生成器</h1>
  <button class="btn tab active" id="tab-md" onclick="setMode('md')">Markdown → 课件</button>
  <button class="btn tab" id="tab-inject" onclick="setMode('inject')">增强已有 HTML</button>
  <div class="meta">
    <input id="meta-title" placeholder="课件标题（自动取 Markdown 一级标题）" style="width:260px">
    <input id="meta-org" placeholder="单位/部门署名（选填）" style="width:180px">
    <button class="btn" id="btn-sample" onclick="loadSample()">载入示例</button>
    <button class="btn btn-primary" id="btn-download" onclick="downloadHtml()" disabled>下载 HTML 课件</button>
  </div>
</div>

<div class="split">
  <div class="pane">
    <div class="pane-head">
      <b class="only-md">Markdown 源文</b>
      <b class="only-inj">你的 HTML 源码</b>
      <span class="tip only-md">用 <code>## </code> 二级标题分节（每节独立解锁，防一滑到底）；一级标题 = 课件标题</span>
      <span class="tip only-inj">粘贴完整 HTML（含 &lt;/html&gt;）；自动按顶层 h1/h2 切节注入门控，样式原样保留</span>
      <label class="btn only-md" style="margin-left:auto">打开 .md 文件
        <input type="file" accept=".md,.markdown,.txt" style="display:none" onchange="openMdFile(this)">
      </label>
      <label class="btn only-inj" style="margin-left:auto">打开 .html 文件
        <input type="file" accept=".html,.htm" style="display:none" onchange="openHtmlFile(this)">
      </label>
    </div>
    <textarea id="md-input" spellcheck="false" placeholder="# 课件标题

## 第一节 标题

正文……

## 第二节 标题

正文……" oninput="render()"></textarea>
    <textarea id="html-input" spellcheck="false" placeholder="<!DOCTYPE html>
<html>
…你的完整 HTML 源码…
</html>" oninput="render()"></textarea>
  </div>
  <div class="pane">
    <div class="pane-head"><b>预览</b><span class="tip" id="sec-count">—</span><span class="tip">（预览里可体验解锁门控）</span></div>
    <iframe id="preview" title="课件预览"></iframe>
  </div>
</div>

<script>
/* ==========================================================================
 * 培训课件生成器（纯前端，无需服务器）
 * --------------------------------------------------------------------------
 * 输入：Markdown 文本（# 为课件标题，## 为节边界）
 * 输出：单文件响应式 HTML 课件，内嵌运行时：
 *   · 分节门控防"一滑到底"：滚动到本节底部 + 驻留时长达标（按字数自适应，
 *     8s~45s）才能点「下一节」，逐节解锁
 *   · 计时与心跳：可见时累计阅读时长；挂进培训系统时每 20s postMessage
 *     上报宿主（宿主转 training_course_heartbeat 记有效学时，失焦自动暂停）
 *   · 进度/完成上报：已解锁节数 / 总节数，最后一节读完 = 100%
 *   · 双模式：检测到宿主（培训系统 iframe）→ 联机上报；独立打开 → 本地模式
 *     （localStorage 记进度，可离线自学，未来小程序 webview 同理）
 * ========================================================================== */

/* ---------------- Markdown 解析（紧凑实现，够用即可） ---------------- */
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function inlineMd(s) {
  s = escapeHtml(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%">');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  return s;
}
/* 块级解析：返回 {title, sections:[{title, html}]} */
function parseMarkdown(md) {
  const lines = md.replace(/\r\n/g, '\n').split('\n');
  let title = '';
  const sections = [];
  let cur = null;          // 当前节 {title, blocks:[]}
  let para = [];           // 段落缓冲
  let i = 0;

  const flushPara = () => {
    if (para.length && cur) { cur.blocks.push('<p>' + inlineMd(para.join(' ')) + '</p>'); para = []; }
    else para = [];
  };
  const ensureCur = () => {
    if (!cur) { cur = { title: '', blocks: [] }; }
  };

  while (i < lines.length) {
    const line = lines[i];

    // 围栏代码块
    if (/^```/.test(line.trim())) {
      flushPara(); ensureCur();
      const buf = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i].trim())) { buf.push(lines[i]); i++; }
      i++;
      cur.blocks.push('<pre><code>' + escapeHtml(buf.join('\n')) + '</code></pre>');
      continue;
    }
    // 表格（| 开头，下一行含 ---）
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      flushPara(); ensureCur();
      const cells = h => h.trim().replace(/^\||\|$/g, '').split('|').map(x => x.trim());
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
      cur.blocks.push('<table><thead><tr>' + head.map(h => '<th>' + inlineMd(h) + '</th>').join('') +
        '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c => '<td>' + inlineMd(c) + '</td>').join('') + '</tr>').join('') +
        '</tbody></table>');
      continue;
    }
    // 标题
    const hm = line.match(/^(#{1,4})\s+(.+)$/);
    if (hm) {
      flushPara();
      const level = hm[1].length;
      const text = hm[2].trim();
      if (level === 1 && !title) { title = text; i++; continue; }
      if (level <= 2) {
        if (cur && (cur.blocks.length || cur.title)) sections.push(cur);
        cur = { title: text, blocks: [] };
        i++; continue;
      }
      ensureCur();
      cur.blocks.push('<h' + (level + 1) + '>' + inlineMd(text) + '</h' + (level + 1) + '>');
      i++; continue;
    }
    // 分隔线
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); ensureCur(); cur.blocks.push('<hr>'); i++; continue; }
    // 引用
    if (/^\s*>\s?/.test(line)) {
      flushPara(); ensureCur();
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      cur.blocks.push('<blockquote>' + buf.map(b => inlineMd(b)).join('<br>') + '</blockquote>');
      continue;
    }
    // 无序列表
    if (/^\s*[-*]\s+/.test(line)) {
      flushPara(); ensureCur();
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push('<li>' + inlineMd(lines[i].replace(/^\s*[-*]\s+/, '')) + '</li>'); i++;
      }
      cur.blocks.push('<ul>' + items.join('') + '</ul>');
      continue;
    }
    // 有序列表
    if (/^\s*\d+[.、]\s+/.test(line)) {
      flushPara(); ensureCur();
      const items = [];
      while (i < lines.length && /^\s*\d+[.、]\s+/.test(lines[i])) {
        items.push('<li>' + inlineMd(lines[i].replace(/^\s*\d+[.、]\s+/, '')) + '</li>'); i++;
      }
      cur.blocks.push('<ol>' + items.join('') + '</ol>');
      continue;
    }
    // 空行
    if (!line.trim()) { flushPara(); i++; continue; }
    // 普通段落
    ensureCur();
    para.push(line.trim());
    i++;
  }
  flushPara();
  if (cur && (cur.blocks.length || cur.title)) sections.push(cur);

  if (!sections.length) sections.push({ title: '', blocks: ['<p>（空课件）</p>'] });
  return { title: title || '未命名课件', sections };
}

/* ---------------- 课件运行时 JS（嵌入产物文件） ----------------
 * 约束：不使用反引号与 ${}，便于以字符串模板嵌入 */
const RUNTIME_JS = [
'(function () {',
'  "use strict";',
'  var secs = Array.prototype.slice.call(document.querySelectorAll(".cw-sec"));',
'  var N = secs.length;',
'  var total = document.getElementById("cw-total");',
'  var bar = document.getElementById("cw-bar");',
'  var nowLabel = document.getElementById("cw-now");',
'  var studyLabel = document.getElementById("cw-study");',
'  if (!N) return;',
'',
'  /* ---------- 状态 ---------- */',
'  var state = secs.map(function () { return { dwell: 0, bottom: false, done: false }; });',
'  var MAXMS = (window.__CW_CONF && window.__CW_CONF.maxMs) || 45000;',
'  var requiredMs = secs.map(function (sec) {',
'    var bodyEl = sec.querySelector(".cw-sec-body");',
'    var textSrc = bodyEl ? bodyEl.textContent : "";',
'    if (!bodyEl) {   /* 注入模式：节体 = section 自身，剔除门控脚注与注入脚本避免计入字数 */',
'      var clone = sec.cloneNode(true);',
'      var rm = clone.querySelectorAll(".cw-sec-foot, script, style");',
'      for (var rx = 0; rx < rm.length; rx++) rm[rx].remove();',
'      textSrc = clone.textContent;',
'    }',
    '    var words = (textSrc || "").replace(/\\s/g, "").length;',
'    return Math.max(8000, Math.min(MAXMS, Math.round(words / 7.5 * 1000)));  /* 约 450 字/分钟 */',
'  });',
'  var online = false;      /* 宿主握手成功 = 联机模式 */',
'  var totalMs = 0;         /* 累计可见学习时长 */',
'  var hbAccumMs = 0;       /* 距上次心跳的可见时长 */',
'  var lsKey = "tr-course:" + (document.title || "untitled");',
'',
'  /* ---------- 工具 ---------- */',
'  function send(msg) {',
'    msg.source = "tr-courseware";',
'    /* 被嵌在 iframe 里就上报（hello 握手在 online 置位前发出，不能按 online 门控）；',
'       独立打开时 parent === window，静默跳过 */',
'    if (window.parent && window.parent !== window) {',
'      window.parent.postMessage(msg, "*");',
'    }',
'  }',
'  function doneCount() { return state.filter(function (s) { return s.done; }).length; }',
'  function fmt(sec) {',
'    var m = Math.floor(sec / 60), s = Math.round(sec % 60);',
'    return (m ? m + " 分 " : "") + s + " 秒";',
'  }',
'  function saveLocal() {',
'    try {',
'      localStorage.setItem(lsKey, JSON.stringify({',
'        done: doneCount(), dwell: state.map(function (s) { return s.dwell; })',
'      }));',
'    } catch (e) { /* 隐私模式忽略 */ }',
'  }',
'  function refreshHeader() {',
'    var d = doneCount();',
'    var pct = Math.round(d / N * 100);',
'    if (bar) bar.style.width = pct + "%";',
'    if (nowLabel) nowLabel.textContent = "已解锁 " + Math.min(d + 1, N) + " / " + N + " 节";',
'    if (total) total.textContent = pct + "%";',
'  }',
'  function postProgress() {',
'    var d = doneCount();',
'    saveLocal();',
'    send({ type: "progress", progress: Math.round(d / N * 100), position: d });',
'  }',
'',
'  /* ---------- 节门控 ---------- */',
'  function refreshGate(i) {',
'    var s = state[i];',
'    var foot = secs[i].querySelector(".cw-sec-foot");',
'    if (!foot) return;',
'    var btn = foot.querySelector(".cw-btn-next");',
'    var msg = foot.querySelector(".cw-gate-msg");',
'    if (!btn) return;',
'    if (s.done) {',
'      foot.classList.add("cw-done");',
'      msg.textContent = "本节已完成" + (i < N - 1 ? "，可返回复习" : "");',
'      btn.style.display = "none";',
'      return;',
'    }',
'    var needSec = Math.round(requiredMs[i] / 1000);',
'    var gotSec = Math.floor(s.dwell / 1000);',
'    var okDwell = s.dwell >= requiredMs[i];',
'    var okScroll = s.bottom;',
'    btn.disabled = !(okDwell && okScroll);',
'    btn.textContent = i === N - 1 ? "完成学习 ✓" : "下一节 ▶";',
'    var parts = [];',
'    parts.push(okScroll ? "已读至本节底部 ✓" : "请滚动读完本节");',
'    parts.push("驻留 " + Math.min(gotSec, needSec) + "/" + needSec + " 秒" + (okDwell ? " ✓" : ""));',
'    msg.textContent = parts.join(" · ");',
'  }',
'  function unlockNext(i) {',
'    state[i].done = true;',
'    secs[i].classList.add("cw-unlocked");',
'    if (i + 1 < N) {',
'      secs[i + 1].classList.add("cw-unlocked");',
'      setTimeout(function () {',
'        secs[i + 1].scrollIntoView({ behavior: "smooth", block: "start" });',
'      }, 60);',
'    } else {',
'      var done0 = document.getElementById("cw-finish");',
'      if (done0) done0.style.display = "block";',
'    }',
'    refreshHeader(); refreshGate(i);',
'    if (i + 1 < N) refreshGate(i + 1);',
'    postProgress();',
'  }',
'',
'  /* ---------- 滚动与驻留采样 ---------- */',
'  function centerSection() {',
'    var mid = window.innerHeight / 2;',
'    for (var i = 0; i < N; i++) {',
'      var r = secs[i].getBoundingClientRect();',
'      if (r.top <= mid && r.bottom > mid) return i;',
'    }',
'    return -1;',
'  }',
'  /* 底部判定：节底边进入视口即算读到底（短于一屏的节无滚动事件，靠定时采样兜底） */',
'  function checkBottomAll() {',
'    for (var i = 0; i < N; i++) {',
'      if (state[i].bottom) continue;',
'      if (!secs[i].classList.contains("cw-unlocked")) continue;  /* 锁定节不可见，rect 全 0 不能参与判定 */',
'      var r = secs[i].getBoundingClientRect();',
'      if (r.top < window.innerHeight && r.bottom <= window.innerHeight + 80) {',
'        state[i].bottom = true; refreshGate(i);',
'      }',
'    }',
'  }',
'  var scrollTimer = null;',
'  window.addEventListener("scroll", function () {',
'    if (scrollTimer) return;',
'    scrollTimer = setTimeout(function () { scrollTimer = null; checkBottomAll(); }, 200);',
'  }, { passive: true });',
'',
'  setInterval(function () {',
'    if (document.visibilityState !== "visible") return;   /* 失焦/切后台不计时 */',
'    var i = centerSection();',
'    if (i >= 0 && !state[i].done) {',
'      state[i].dwell += 500;',
'      refreshGate(i);',
'    }',
'    checkBottomAll();',
'    totalMs += 500; hbAccumMs += 500;',
'    if (studyLabel && totalMs % 5000 === 0) {',
'      studyLabel.textContent = "本次已学 " + fmt(totalMs / 1000);',
'    }',
'  }, 500);',
'',
'  /* ---------- 心跳：联机模式下每 20s 上报一次有效时长 ---------- */',
'  setInterval(function () {',
'    if (!online || document.visibilityState !== "visible") return;',
'    var delta = Math.floor(hbAccumMs / 1000);',
'    hbAccumMs = 0;',
'    if (delta <= 0) return;',
'    send({ type: "heartbeat", deltaSec: Math.min(delta, 60),',
'           position: doneCount(), progress: Math.round(doneCount() / N * 100) });',
'  }, 20000);',
'',
'  /* ---------- 宿主握手 / 本地恢复 ---------- */',
'  window.addEventListener("message", function (e) {',
'    var d = e.data;',
'    if (!d || d.source !== "tr-host") return;',
'    online = true;',
'    if (d.type === "hello") {',
'      /* 以服务端进度为准：全量重置后再恢复，避免本地旧进度抢先生效 */',
'      for (var i = 0; i < N; i++) {',
'        state[i].done = false;',
'        secs[i].classList.remove("cw-unlocked");',
'      }',
'      var upto = Math.min(d.position || 0, N);',
'      for (var i2 = 0; i2 < upto; i2++) {',
'        state[i2].done = true;',
'        secs[i2].classList.add("cw-unlocked");',
'      }',
'      if (upto < N) secs[upto].classList.add("cw-unlocked");',
'      refreshHeader();',
'      for (var j = 0; j < N; j++) refreshGate(j);',
'      var nxt = secs[upto];',
'      if (upto < N && nxt) nxt.scrollIntoView({ block: "start" });',
'    }',
'    send({ type: "hello-ack", online: true });',
'  });',
'',
'  /* 首节立即解锁（不等 window load）：注入模式下避免锁定 CSS 造成整页闪烁 */',
'  refreshHeader();',
'  for (var j0 = 0; j0 < N; j0++) refreshGate(j0);',
'  secs[0].classList.add("cw-unlocked");',
'',
'  /* 本地模式（独立打开 / 微信直接打开）：从 localStorage 恢复 */',
'  window.addEventListener("load", function () {',
'    if (!online) {',
'      var saved = null;',
'      try { saved = JSON.parse(localStorage.getItem(lsKey) || "null"); } catch (e) {}',
'      if (saved && saved.done > 0) {',
'        var upto = Math.min(saved.done, N);',
'        for (var i = 0; i < upto; i++) {',
'          state[i].done = true; state[i].bottom = true;',
'          if (saved.dwell && saved.dwell[i]) state[i].dwell = saved.dwell[i];',
'          secs[i].classList.add("cw-unlocked");',
'          if (i + 1 < N) secs[i + 1].classList.add("cw-unlocked");',
'        }',
'        refreshHeader();',
'        for (var k = 0; k < N; k++) refreshGate(k);',
'      }',
'      postProgress();   /* 本地落一次盘 */',
'    }',
'    send({ type: "hello" });   /* 请求宿主握手（独立打开时无人应答，静默） */',
'  });',
'',
'  /* 绑定按钮 */',
'  secs.forEach(function (sec, i) {',
'    var btn = sec.querySelector(".cw-btn-next");',
'    if (btn) btn.addEventListener("click", function () { unlockNext(i); });',
'  });',
'})();',
].join('\n');

/* ---------------- 课件 HTML 模板 ---------------- */
function buildCourseHtml(title, sections, org) {
  const body = sections.map((s, i) => {
    const last = i === sections.length - 1;
    return [
      '<section class="cw-sec" data-i="' + i + '">',
      '<div class="cw-sec-head"><span class="cw-sec-no">第 ' + (i + 1) + ' / ' + sections.length + ' 节</span>',
      (s.title ? '<h2>' + inlineMd(s.title) + '</h2>' : ''),
      '</div>',
      '<div class="cw-sec-body">' + s.blocks.join('\n') + '</div>',
      '<div class="cw-sec-foot"><span class="cw-gate-msg">正在读取本节…</span>',
      '<button type="button" class="cw-btn-next" disabled>' + (last ? '完成学习 ✓' : '下一节 ▶') + '</button>',
      '</div>',
      '</section>',
    ].join('\n');
  }).join('\n');

  const css = [

  const esc = escapeHtml;
  const orgLine = org ? ' · ' + esc(org) : '';
  return [
    '<!DOCTYPE html>',

}

/* ---------------- HTML 增强模式：向已有 HTML 注入控制运行时 ----------------
 * 用户自带精美 HTML → 保留全部样式，注入：
 *   ① 分节门控（顶层 h1/h2 自动切节，逐节解锁防一滑到底）
 *   ② 顶部进度条 + 已学时长（sticky，不干扰原样式）
 *   ③ 心跳/进度 postMessage 协议（与 mine.js 宿主一致）
 * 无顶层 h1/h2 → 整页模式：整页一节，读完+驻留≤10 分钟后完成 */
const INJECT_CSS = [
  '.cw-inj-header{position:sticky;top:0;z-index:9999;background:rgba(255,255,255,.97);',
  '  border-bottom:1px solid #e5e7eb;padding:8px 16px;font-family:"Microsoft YaHei",system-ui,sans-serif;',
  '  font-size:12px;color:#6b7280;box-shadow:0 1px 4px rgba(0,0,0,.06)}',
  '.cw-inj-meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center}',
  '.cw-inj-header .cw-progress{flex:1;min-width:120px;height:6px;background:#e5e7eb;border-radius:3px;',
  '  overflow:hidden;align-self:center;margin:0}',
  '.cw-progress i{display:block;height:100%;width:0;background:#4f46e5;transition:width .3s}',
  '.cw-sec:not(.cw-unlocked){display:none !important}',
  '.cw-sec-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;',
  '  border-top:1px dashed #e5e7eb;margin-top:20px;padding-top:12px;flex-wrap:wrap;',
  '  font-family:"Microsoft YaHei",system-ui,sans-serif}',
  '.cw-gate-msg{font-size:12px;color:#6b7280}',
  '.cw-btn-next{padding:8px 20px;border-radius:8px;border:none;background:#4f46e5;color:#fff;',
  '  font-size:14px;cursor:pointer}',
  '.cw-btn-next:disabled{background:#cbd5e1;cursor:not-allowed}',
  '.cw-sec-foot.cw-done .cw-gate-msg{color:#16a34a;font-weight:600}',
  '#cw-finish{display:none;background:#ecfdf5;border:1px solid #86efac;border-radius:12px;',
  '  padding:16px 20px;margin:18px 16px;color:#166534;font-weight:600;text-align:center;',
  '  font-family:"Microsoft YaHei",system-ui,sans-serif}',
  '@media print{.cw-sec{display:block !important}.cw-sec-foot,.cw-inj-header,#cw-finish{display:none !important}}',
].join('\n');

function enhanceExistingHtml(src) {
  const doc = new DOMParser().parseFromString(src, 'text/html');
  if (!doc.body || !doc.body.textContent.trim()) throw new Error('未解析到页面内容，请确认粘贴的是完整 HTML');
  const body = doc.body;

  /* 重复增强防护：拆掉上次注入的节/脚注/头，恢复原始流再处理 */
  doc.querySelectorAll('.cw-inj-header, .cw-sec-foot, #cw-finish, style[data-cw-inject], script[data-cw-runtime]')
    .forEach(el => el.remove());
  doc.querySelectorAll('.cw-sec').forEach(sec => {
    if (sec.getAttribute('data-cw-pre') === '1') {
      /* 预分节容器：是用户自己的原始元素，只摘掉我们加的类名，不拆结构 */
      sec.classList.remove('cw-sec', 'cw-unlocked');
      sec.removeAttribute('data-cw-pre');
    } else if (sec.tagName === 'SECTION') {
      /* 我们包裹生成的 section：拆开还原 */
      while (sec.firstChild) sec.parentNode.insertBefore(sec.firstChild, sec);
      sec.remove();
    } else {
      sec.classList.remove('cw-sec', 'cw-unlocked');
    }
  });
  body.classList.remove('cw-sec', 'cw-whole');

  const isHead = n => n.nodeType === 1 && /^(H1|H2)$/.test(n.tagName);
  const isEmptyNode = n => n.nodeType === 3 && !n.textContent.trim();
  /* 字数统计：剔除注入物（脚注/脚本/样式）后再数 */
  const textCount = el => {
    const c = el.cloneNode(true);
    c.querySelectorAll('.cw-sec-foot, script, style').forEach(x => x.remove());
    return (c.textContent || '').replace(/\s/g, '').length;
  };
  const buildFoot = () => {
    const foot = doc.createElement('div');
    foot.className = 'cw-sec-foot';
    foot.innerHTML = '<span class="cw-gate-msg">正在读取本节…</span>'
      + '<button type="button" class="cw-btn-next" disabled>下一节 ▶</button>';
    return foot;
  };

  /* ---- 找"节根"容器：直接子元素中含 ≥2 个 h1/h2 的最浅元素（含 body 自身）。
   * 用户的精美 HTML 标题常嵌在 .wrap/.container 类容器里，必须下探 ---- */
  const directHeadCount = el => Array.from(el.children).filter(c => /^(H1|H2)$/.test(c.tagName)).length;
  let root = null;
  if (directHeadCount(body) >= 2) {
    root = body;
  } else {
    const queue = Array.from(body.children);
    while (queue.length && !root) {
      const el = queue.shift();
      if (directHeadCount(el) >= 2) { root = el; break; }
      queue.push(...el.children);
    }
  }

  /* ---- 预分节结构：每个 h1/h2 各自包在自己的 <section>/<div> 容器里
   * （豆包等 AI 生成的 HTML 极常见，如 <section id="overview"><h2>…</h2>…</section> ×N）。
   * 此时不存在"≥2 个直接标题"的容器，上面的 BFS 必然落空。
   * 处理：逐层下探，找"≥2 个直接子容器各自含 h1/h2"的最浅容器，
   * 直接给这些子容器原地上门控（加 cw-sec 类），一个节点都不搬 ---- */
  let preSecs = null;
  if (!root) {
    const subHeads = el => el.querySelectorAll('h1,h2').length;
    const txtLen = el => {
      const c = el.cloneNode(true);
      c.querySelectorAll('script,style').forEach(x => x.remove());
      return (c.textContent || '').replace(/\s/g, '').length;
    };
    let level = [body];   /* 从 body 本身查起：section 们可能就是 body 的直接子元素 */
    while (level.length && !preSecs) {
      const next = [];
      for (const el of level) {
        const withHead = Array.from(el.children).filter(k => subHeads(k) >= 1);
        /* ≥2 个含标题的子容器，且覆盖该层大部分标题、单个容器标题数 ≤3
         *（防止把整个正文容器或导航栏误判成一节） */
        if (withHead.length >= 2 && withHead.every(k => subHeads(k) <= 3)
            && withHead.length >= Math.ceil(subHeads(el) * 0.6)) {
          /* 内容均衡校验：真实分节是"每节都摊到一块内容"，若某个容器独占
           * 大部分正文（如"标题条 + 正文大杂烩"），说明不是预分节结构 */
          const total = withHead.reduce((s, k) => s + txtLen(k), 0);
          if (total > 0 && withHead.every(k => txtLen(k) <= total * 0.6)) {
            root = el; preSecs = withHead; break;
          }
        }
        next.push(...el.children);
      }
      level = next;
    }
  }

  let mode = 'whole', conf = { maxMs: 600000 }, secCount = 1;   /* 默认整页；找到节根才切换分节 */
  if (root && preSecs) {
    /* ---- 分节模式（预分节容器）：用户原始容器直接作节，零搬动 ---- */
    mode = 'sections';
    conf = null;
    preSecs.forEach(sec => {
      sec.classList.add('cw-sec');
      sec.setAttribute('data-cw-pre', '1');
      sec.appendChild(buildFoot());
    });
    secCount = preSecs.length;
  } else if (root && root !== body) {
    /* ---- 分节模式（容器内）：节 section 原地包裹在 root 内部，
     * root 之前/之后的兄弟（封面、页脚）保持原位常驻，布局零破坏 ---- */
    mode = 'sections';
    conf = null;
    const groups = [];
    let cur = { head: null, nodes: [] };
    Array.from(root.childNodes).forEach(n => {
      if (isHead(n)) { groups.push(cur); cur = { head: n, nodes: [] }; }
      else cur.nodes.push(n);
    });
    groups.push(cur);
    /* 标题前的散内容并入下一个标题节开头；尾部散内容并入最后一节 */
    const secsData = [];
    let pending = [];
    groups.forEach(g => {
      if (g.head) { secsData.push({ head: g.head, nodes: [...pending, ...g.nodes] }); pending = []; }
      else pending.push(...g.nodes);
    });
    if (secsData.length) pending.forEach(n => secsData[secsData.length - 1].nodes.push(n));
    const valid = secsData.filter(g => g.head && g.nodes.concat(g.head).some(n => !isEmptyNode(n)));
    root.textContent = '';
    valid.forEach(g => {
      const sec = doc.createElement('section');
      sec.className = 'cw-sec';
      sec.appendChild(g.head);
      g.nodes.forEach(n => sec.appendChild(n));
      sec.appendChild(buildFoot());
      root.appendChild(sec);
    });
    secCount = valid.length;
    if (!secCount) mode = 'whole';
  } else if (root === body) {
    /* ---- 分节模式（body 顶层） ---- */
    mode = 'sections';
    conf = null;
    const groups = [];
    let cur = { head: null, nodes: [] };
    Array.from(body.childNodes).forEach(n => {
      if (isHead(n)) { groups.push(cur); cur = { head: n, nodes: [] }; }
      else cur.nodes.push(n);
    });
    groups.push(cur);
    const secsData = [];
    let pending = [];
    groups.forEach(g => {
      if (g.head) { secsData.push({ head: g.head, nodes: [...pending, ...g.nodes] }); pending = []; }
      else pending.push(...g.nodes);
    });
    if (secsData.length) pending.forEach(n => secsData[secsData.length - 1].nodes.push(n));
    const valid = secsData.filter(g => g.head);
    body.textContent = '';
    valid.forEach(g => {
      const sec = doc.createElement('section');
      sec.className = 'cw-sec';
      sec.appendChild(g.head);
      g.nodes.forEach(n => sec.appendChild(n));
      sec.appendChild(buildFoot());
      body.appendChild(sec);
    });
    secCount = valid.length;
    if (!secCount) mode = 'whole';
  }
  if (mode === 'whole') {
    /* ---- 整页模式：body 即唯一一节 ---- */
    body.classList.add('cw-sec', 'cw-whole');
    body.appendChild(buildFoot());
    body.appendChild(doc.createElement('div')).id = 'cw-finish';
    doc.getElementById('cw-finish').textContent = '🎉 恭喜，本课件学习完成！可关闭本页返回培训系统。';
    conf = { maxMs: 600000 };
    secCount = 1;
  }

  /* 顶部进度条 */
  const hdr = doc.createElement('div');
  hdr.className = 'cw-inj-header';
  hdr.innerHTML = '<div class="cw-inj-meta"><span id="cw-now">—</span>'
    + '<span id="cw-study">本次已学 0 秒</span>'
    + '<span>完成度 <b id="cw-total">0%</b></span></div>'
    + '<div class="cw-progress"><i id="cw-bar"></i></div>';
  body.insertBefore(hdr, body.firstChild);
  /* 完成提示（分节模式） */
  if (mode === 'sections' && !doc.getElementById('cw-finish')) {
    const fin = doc.createElement('div');
    fin.id = 'cw-finish';
    fin.textContent = '🎉 恭喜，全部小节学习完成！可关闭本页返回培训系统。';
    body.appendChild(fin);
  }
  /* 注入样式 + 运行时（data 属性标记便于重复增强时清除） */
  const styleEl = doc.createElement('style');
  styleEl.setAttribute('data-cw-inject', '1');
  styleEl.textContent = INJECT_CSS;
  doc.head.appendChild(styleEl);
  const confEl = doc.createElement('script');
  confEl.textContent = 'window.__CW_CONF=' + JSON.stringify(conf || {}) + ';';
  body.appendChild(confEl);
  const rt = doc.createElement('script');
  rt.setAttribute('data-cw-runtime', '1');
  rt.textContent = RUNTIME_JS;
  body.appendChild(rt);

  /* 每节驻留预览：与运行时同款公式（450 字/分钟，8~45s 自适应），生成时即可告知用户 */
  const secSecs = mode === 'sections'
    ? Array.from(doc.querySelectorAll('section.cw-sec')).map(sec => {
        const c = sec.cloneNode(true);
        c.querySelectorAll('.cw-sec-foot, script, style').forEach(x => x.remove());
        const w = (c.textContent || '').replace(/\s/g, '').length;
        return Math.max(8, Math.min(45, Math.round(w / 7.5)));
      })
    : null;

  return {
    html: '<!DOCTYPE html>\n' + doc.documentElement.outerHTML,
    mode, count: secCount, words: textCount(body), pre: !!preSecs,
    secs: secSecs,
    title: (doc.title || '培训课件').trim(),
  };
}

/* ---------------- 生成器交互 ---------------- */
let currentHtml = '';
let mode = 'md';          /* md = Markdown 模式 | inject = HTML 增强模式 */
let injTitle = '培训课件';

function setMode(m) {
  mode = m;
  document.body.classList.toggle('mode-inject', m === 'inject');
  document.getElementById('tab-md').classList.toggle('active', m === 'md');
  document.getElementById('tab-inject').classList.toggle('active', m === 'inject');
  render();
}

function render() { if (mode === 'md') renderMd(); else renderInj(); }

function renderMd() {
  const md = document.getElementById('md-input').value;
  const titleInput = document.getElementById('meta-title');
  const org = document.getElementById('meta-org').value.trim();
  if (!titleInput.value || titleInput.dataset.auto !== '0') {
    const m = md.match(/^#\s+(.+)$/m);
    if (m) { titleInput.value = m[1].trim(); titleInput.dataset.auto = '1'; }
  }
  const parsed = parseMarkdown(md);
  const title = titleInput.value.trim() || parsed.title;
  currentHtml = buildCourseHtml(title, parsed.sections, org);
  document.getElementById('preview').srcdoc = currentHtml;
  document.getElementById('sec-count').textContent =
    parsed.sections.length + ' 节 · ' + md.replace(/\s/g, '').length + ' 字';
  document.getElementById('btn-download').disabled = !md.trim();
}

function renderInj() {
  const src = document.getElementById('html-input').value;
  const info = document.getElementById('sec-count');
  const btn = document.getElementById('btn-download');
  if (!src.trim()) {
    currentHtml = ''; btn.disabled = true;
    info.textContent = '粘贴完整 HTML 源码（含 </html>），或点右侧打开 .html 文件';
    return;
  }
  try {
    const r = enhanceExistingHtml(src);
    currentHtml = r.html;
    injTitle = r.title;
    document.getElementById('preview').srcdoc = currentHtml;
    const dwellDesc = r.secs && r.secs.length <= 12
      ? '（各节驻留 ' + r.secs.join('/') + ' 秒）'
      : (r.secs ? '（各节驻留 ' + Math.min.apply(null, r.secs) + '~' + Math.max.apply(null, r.secs) + ' 秒）' : '');
    info.textContent = r.mode === 'sections'
      ? (r.pre
          ? '分节模式 · 检测到预分节结构（' + r.count + ' 个章节容器各含一个标题）→ ' + r.count + ' 节逐节解锁，全文约 ' + r.words + ' 字，驻留 8~45 秒/节按字数自适应（450 字/分钟）' + dwellDesc
          : '分节模式 · 检测到 ' + r.count + ' 个顶层标题 → ' + r.count + ' 节逐节解锁，全文约 ' + r.words + ' 字，驻留 8~45 秒/节按字数自适应（450 字/分钟）' + dwellDesc)
      : '整页模式 · 未检测到可分节的标题结构 → 整页一节：读到底 + 驻留约 ' + Math.min(600, Math.round(r.words / 7.5)) + ' 秒后完成（要分节请把各章标题放进各自独立的 <section> 容器，或并列放在同一容器下）';
    btn.disabled = false;
  } catch (e) {
    currentHtml = ''; btn.disabled = true;
    info.textContent = '解析失败：' + e.message;
  }
}
document.getElementById('meta-title').addEventListener('input', function () { this.dataset.auto = '0'; render(); });
document.getElementById('meta-org').addEventListener('input', render);

function downloadHtml() {
  const name = (mode === 'md'
    ? (document.getElementById('meta-title').value.trim() || '培训课件')
    : injTitle + '（增强版）') + '.html';   /* 加后缀防止与原始文件同名混淆 */
  const blob = new Blob([currentHtml], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

function openFileAsText(input, cb) {
  const f = input.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => cb(reader.result);
  reader.readAsText(f, 'utf-8');
  input.value = '';
}

function openMdFile(input) {
  openFileAsText(input, (text) => {
    document.getElementById('md-input').value = text;
    const t = document.getElementById('meta-title');
    t.value = ''; t.dataset.auto = '1';
    render();
  });
}

function openHtmlFile(input) {
  openFileAsText(input, (text) => {
    document.getElementById('html-input').value = text;
    render();
  });
}

function loadSample() {
  document.getElementById('md-input').value = SAMPLE_MD;
  const t = document.getElementById('meta-title');
  t.value = ''; t.dataset.auto = '1';
  render();
}
